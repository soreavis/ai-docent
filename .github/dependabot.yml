version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # The validator's only dependency. Without a manifest here it was pinned
  # inline in two workflows, where nothing could bump it and the two copies
  # were free to drift apart.
  - package-ecosystem: "pip"
    directory: "/build"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
