name: Bug Report
description: Something in a course behaves incorrectly
labels: ["bug"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - Claude Code
        - Claude web / desktop / Cowork
        - ChatGPT
        - Codex
        - Cursor
        - Gemini CLI
        - Copilot / GitHub CLI
        - Grok
        - Another agent (say which below)
    validations: { required: true }
  - type: dropdown
    id: course
    attributes:
      label: Which course?
      options:
        - foundations
        - prompt-craft
        - reliability
        - shipping
        - long-haul
        - security
        - mechanics
        - builder
        - start
        - companion
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: "From your plugin manager, or the `version` in the skill's frontmatter"
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "What did you ask, and at which lesson?"
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: "Do not paste secrets, API keys, or personal data."
    validations: { required: true }
