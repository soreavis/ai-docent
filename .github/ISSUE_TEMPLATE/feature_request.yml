name: Feature Request
description: Suggest a lesson, a course, or an improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: What kind of change?
      options:
        - A new lesson in an existing course
        - A change to an existing lesson
        - A whole new course
        - Tooling, packaging, or docs
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What does a learner struggle with today?"
    validations: { required: true }
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
    validations: { required: false }
