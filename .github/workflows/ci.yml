name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - run: pip install --quiet pyyaml
      - run: python3 build/validate.py

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck build/zip.sh

  zips:
    name: Build claude.ai zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./build/zip.sh
      - uses: actions/upload-artifact@v7
        with:
          name: skill-zips
          path: dist/*.zip
