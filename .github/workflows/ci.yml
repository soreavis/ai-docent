name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Release Please dispatches this on its release PR branch, because a PR opened
  # with GITHUB_TOKEN never triggers pull_request runs by itself.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Full history: --history scans every reachable commit, not just HEAD.
        # On a pull request, check out the PR head: GitHub's synthetic merge
        # commit carries the author's account address, not the one they used.
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: '3.x' }
      - run: pip install --quiet -r build/requirements.txt
      - run: python3 build/validate.py --history
      # Prove the gates still fire. A gate that silently stopped checking looks
      # exactly like a repo with nothing wrong in it.
      - run: python3 build/test_validate.py

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - run: shellcheck build/zip.sh .githooks/pre-push

  zips:
    name: Build claude.ai zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - run: ./build/zip.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: skill-zips
          path: dist/*.zip
