name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A release PR opened with GITHUB_TOKEN gets no CI on its own. A
      # workflow_dispatch is the one event that token can still trigger, so the
      # version bump is validated before it is merged rather than after.
      - name: Run CI on the release PR
        if: steps.release.outputs.prs_created == 'true'
        # The PR JSON is parsed in the shell: a fromJSON() in env is evaluated
        # before this step's if, and fails the job whenever no PR was opened.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: gh workflow run ci.yml --ref "$(jq -r .headBranchName <<<"$PR")" -R "$GITHUB_REPOSITORY"

  # Attaching the zips lives here rather than in a `release: published` workflow:
  # a release created with GITHUB_TOKEN does not trigger further workflow runs.
  attach-zips:
    name: Attach skill zips
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: '3.x' }
      - run: pip install --quiet -r build/requirements.txt
      - run: python3 build/validate.py
      - run: ./build/zip.sh
      - name: Upload zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/*.zip --clobber
