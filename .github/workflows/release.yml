name: Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zips:
    name: Attach claude.ai skill zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 build/validate.py
      - run: ./build/zip.sh
      - name: Upload zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
